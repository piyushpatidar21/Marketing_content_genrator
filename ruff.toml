target-version = "py312"
line-length = 120

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # Line too long (formatting handled by ruff format)
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends/Query pattern)
    "UP045",  # Use X | None for type annotations
    "UP046",  # Generic class uses Generic[T] (Pydantic generic model standard)
    "SIM108", # Use ternary operator instead of if-else
    "E712",   # Avoid equality comparison to True (SQLAlchemy queries)
]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "Query",
    "fastapi.Path",
    "fastapi.params.Path",
    "Path",
    "fastapi.Security",
    "Security",
]
